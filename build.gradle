plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // Локально установленная IntelliJ IDEA (snap)
        local('/snap/intellij-idea/current')
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '262'
            untilBuild = provider { null }
        }
    }
}

// GUI Designer forms не используются — инструментация не нужна
// (её артефакты иногда недоступны из-за сетевых таймаутов JetBrains)
tasks.named('instrumentCode') {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
